requirements:
  - A flag with is_flag=True and an explicit type must still use the correct implicit flag value.
  - A flag with default=True must toggle to False when passed.
  - Bool ParamType behavior must match Python bool behavior.
  - Non-bool typed flag behavior must remain compatible with existing Click semantics.
